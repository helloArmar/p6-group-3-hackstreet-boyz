<svg width="560" height="160" viewBox="0 0 560 160" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon: rounded square in navy #1B2B4B with white house/key mark -->
  <rect x="12" y="20" width="120" height="120" rx="28" fill="#1B2B4B"/>

  <g transform="translate(72,80)">
    <!-- roof -->
    <path d="M -32 -4 L 0 -32 L 32 -4" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- house body -->
    <path d="M -22 -4 L -22 28 L 22 28 L 22 -4" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- keyhole door -->
    <circle cx="0" cy="12" r="5.5" fill="#FFFFFF"/>
    <rect x="-2.5" y="16" width="5" height="9" rx="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <text x="164" y="88" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="46" fill="#1B2B4B">Rent<tspan fill="#1B2B4B" font-weight="800">Ease</tspan></text>
  <text x="166" y="112" font-family="'Segoe UI', Arial, sans-serif" font-weight="500" font-size="15" letter-spacing="2" fill="#5A6B8C">RENTALS MADE SIMPLE</text>
</svg>
