services:
  - type: web
    name: p6-group-3-hackstreet-boyz
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: p6-group-3-hackstreet-boyz-1
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://p6-group-3-hackstreet-boyz.onrender.com/api/*
      - type: rewrite
        source: /socket.io/*
        destination: https://p6-group-3-hackstreet-boyz.onrender.com/socket.io/*
      - type: rewrite
        source: /*
        destination: /index.html
